name: QMA Institutional CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Full-Stack Verification Loop
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx psycopg2-binary pydantic fastapi

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Agents Dependencies
        run: |
          cd agents
          npm ci

      - name: Frontend TypeScript Typecheck
        run: |
          cd frontend
          npm run typecheck

      - name: Agents TypeScript Typecheck
        run: |
          cd agents
          npm run typecheck

      - name: Frontend Production Build
        run: |
          cd frontend
          npm run build

      - name: Run Pytest Unit & API Test Suites
        run: |
          python -m pytest tests/unit/ tests/api_v1/ -q

      - name: Run 6-Phase Master Verification Loop
        run: |
          python scripts/verification_loop.py
